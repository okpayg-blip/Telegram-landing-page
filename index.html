
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>DailyIncomeHubIndia - Telegram</title>
  <meta name="description" content="Join DailyIncomeHubIndia on Telegram.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f4f5;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.06);
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #229ed9;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    .username {
      color: #888;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .description {
      color: #555;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 26px;
    }

    .join {
      display: block;
      width: 100%;
      padding: 15px 12px;
      background: #229ed9;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .join:active {
      opacity: 0.8;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="logo"
      src="https://placehold.co/200x200/229ed9/ffffff?text=DIH"
      alt="DailyIncomeHubIndia logo"
    >

    <h1>DailyIncomeHubIndia</h1>
    <div class="username">@DailyIncomeHubIndia</div>

    <p class="description">
      Welcome to DailyIncomeHubIndia!<br>
      Join our Telegram channel to see our latest posts and updates.
    </p>

    <a
      class="join"
      href="https://t.me/DailyIncomeHubIndia"
      target="_blank"
      rel="noopener noreferrer"
    >
      JOIN CHANNEL
    </a>

    <div class="footer">
      Open in Telegram to join the channel
    </div>
  </main>
</body>
</html>
